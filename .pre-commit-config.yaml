repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.83.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
      - id: terraform_tfsec
      - id: terraform_docs
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Secret scanning — requires `gitleaks` to be installed
  # (https://github.com/gitleaks/gitleaks/releases). Uses .gitleaks.toml at
  # the repo root for custom allowlists and rule overrides.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: [--config, .gitleaks.toml]

  # Rust formatting — requires `rustfmt` to be installed (`rustup component add rustfmt`)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --all --
        types: [rust]
        pass_filenames: false

  # TypeScript / JavaScript formatting and linting
  # Requires `prettier` and `eslint` to be available (run `pnpm install` first)
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: pnpm exec prettier --write
        types_or: [javascript, jsx, ts, tsx, json, css, markdown]
        pass_filenames: true

      - id: eslint
        name: eslint
        language: system
        entry: pnpm exec eslint --fix
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
