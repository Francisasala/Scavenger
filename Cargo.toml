[workspace]
members = ["stellar-contract", "backend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/drips-network/scavenger"


[workspace.dependencies]
# Pinned to a single version so every workspace member resolves the same
# soroban-sdk (and its transitive deps) — avoids duplicate crate versions in
# the lockfile. See issue #1563.
soroban-sdk = "=21.7.7"

# ---------------------------------------------------------------------------
# Workspace-wide lint configuration (issue #1308)
#
# All crates opt in with `lints = { workspace = true }` in their Cargo.toml.
# The deny list here mirrors what clippy.toml previously enforced, so that
# the same set of lints is applied uniformly across every workspace member
# without each crate needing to repeat the declarations.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
# Treat unused imports/variables as hard errors to catch dead code early.
# Upgraded from "warn" to "deny" as part of issue #1783 (-D warnings rollout).
unused = "deny"
# Forbid unsafe code at the workspace level; individual crates can opt out
# with an explicit `unsafe_code = "allow"` in their own [lints.rust] section.
unsafe_code = "deny"

[workspace.lints.clippy]
# ---------------------------------------------------------------------------
# Core safety lints — set to "warn" so that `cargo check`/`cargo build` surface
# them, and the CI step `cargo clippy -- -D warnings` (issue #1783) promotes
# every warning to a hard error, ensuring no regression is merged.
#
# Using "warn" here (rather than "deny") is intentional: Cargo does not
# provide a per-cfg lint level, so setting "deny" would also reject the same
# patterns in `#[cfg(test)]` code where `.unwrap()` and `.expect()` are
# idiomatic. The CI `-D warnings` flag provides the same enforcement for
# production code paths without breaking test compilation.
# ---------------------------------------------------------------------------
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# `integer_arithmetic` was removed from newer Clippy toolchains; the
# equivalent check that covers overflow is `arithmetic_side_effects`.
arithmetic_side_effects = "warn"

# ---------------------------------------------------------------------------
# Quality lints — warn to surface issues in CI output without hard-blocking.
# ---------------------------------------------------------------------------
pedantic = "warn"
# Allow the few patterns that `pedantic` flags but are idiomatic project-wide.
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
