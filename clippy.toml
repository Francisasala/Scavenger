# clippy.toml — workspace-level Clippy configuration
#
# Lint *levels* (deny/warn/allow) are declared in the [workspace.lints.clippy]
# section of the root Cargo.toml and enforced uniformly across every workspace
# crate via `lints = { workspace = true }`.  The CI step in
# `.github/workflows/rust-checks.yml` runs:
#
#   cargo clippy --all-targets --all-features -- -D warnings
#
# which turns every warning into a hard error, so any new violation breaks the
# build immediately (regression guard).
#
# This file configures Clippy *behaviour* (not lint levels).  Valid keys are
# documented at https://doc.rust-lang.org/clippy/configuration.html
# ---------------------------------------------------------------------------

# Warn when an array of string literals exceeds this length.
# Useful for catching accidental large inline arrays.
array-size-threshold = 512000

# Maximum allowed cognitive complexity for a single function.
cognitive-complexity-threshold = 25

# Maximum number of lines allowed in a function body.
too-many-lines-threshold = 100

# Minimum number of characters in a string literal before Clippy suggests
# extracting it to a named constant.
min-ident-chars-threshold = 1

# Allow closures with a single expression to remain on one line.
# Keeps simple iterator chains readable.
single-char-binding-names-threshold = 4

# Disallow shadowing of variables with the same name in nested scopes only
# when the type also changes (more restrictive than the default).
# Not a lint level — this is a behavioural hint to the shadow lint.
allow-shadowing = false
